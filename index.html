<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Cherry Blossom Interactive Demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px 40px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
      max-width: 480px;
    }
    h1 {
      margin-top: 0;
      font-size: 2rem;
    }
    p {
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    button {
      background: #ff8da1;
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background: #ff7088;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌸 Cherry Blossom Demo</h1>
    <p>Move your mouse around to create wind swirls and disperse the falling sakura petals!</p>
    <div class="controls">
      <button id="toggleBtn">Pause</button>
      <button id="moreBtn">+ More Petals</button>
      <button id="fewerBtn">- Fewer Petals</button>
    </div>
  </div>

  <script src="./dist/cherryblossom.global.global.js"></script>
  <script>
    const blossom = new CherryBlossom({
      number: 55,
      wind: {
        speed: 1.5,
        gust: 1.8,
        enableMouseBreeze: true,
        mouseRadius: 150,
        mouseForce: 2.2
      }
    });

    const toggleBtn = document.getElementById("toggleBtn");
    let isRunning = true;
    toggleBtn.addEventListener("click", () => {
      if (isRunning) {
        blossom.stop();
        toggleBtn.textContent = "Resume";
      } else {
        blossom.start();
        toggleBtn.textContent = "Pause";
      }
      isRunning = !isRunning;
    });

    document.getElementById("moreBtn").addEventListener("click", () => {
      blossom.number += 20;
    });

    document.getElementById("fewerBtn").addEventListener("click", () => {
      blossom.number = Math.max(10, blossom.number - 20);
    });
  </script>
</body>
</html>
