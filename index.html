<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸 Cherry Blossom Interactive Demo | let-it-blossom</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1b1726 0%, #302b42 50%, #524765 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
      max-width: 520px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 2.2rem;
      letter-spacing: -0.5px;
    }
    .tagline {
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badges {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .badges a img {
      vertical-align: middle;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    button {
      background: #ff758f;
      border: none;
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 117, 143, 0.4);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    button:hover {
      background: #ff5c7c;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 117, 143, 0.55);
    }
    button:active {
      transform: translateY(1px);
    }
    .install-box {
      margin-top: 24px;
      background: rgba(0, 0, 0, 0.35);
      padding: 12px 18px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.9rem;
      color: #ffd1dc;
      display: inline-block;
      user-select: all;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌸 Let It Blossom</h1>
    <div class="badges">
      <a href="https://badge.socket.dev/npm/package/let-it-blossom/1.0.0" target="_blank" rel="noopener">
        <img src="https://badge.socket.dev/npm/package/let-it-blossom/1.0.0" alt="Socket Badge">
      </a>
      <a href="https://www.npmjs.com/package/let-it-blossom" target="_blank" rel="noopener">
        <img src="https://img.shields.io/npm/v/let-it-blossom.svg?color=ff758f" alt="npm version">
      </a>
      <a href="https://github.com/austinhttps/let-it-blossom/blob/main/LICENSE" target="_blank" rel="noopener">
        <img src="https://img.shields.io/github/license/austinhttps/let-it-blossom" alt="License">
      </a>
    </div>
    <p class="tagline">Realistic, zero-dependency floating cherry blossom petals with 3D flutter, dynamic wind variations, and mouse breeze interaction.</p>

    <div class="install-box">npm i let-it-blossom</div>

    <div class="controls">
      <button id="toggleBtn">Pause</button>
      <button id="moreBtn">+ More Petals</button>
      <button id="fewerBtn">- Fewer Petals</button>
    </div>
  </div>

  <!-- CDN fallback script loader: loads local build when served locally or built on Pages, with unpkg fallback -->
  <script>
    (function() {
      function initBlossom() {
        if (typeof CherryBlossom === "undefined") {
          console.error("CherryBlossom library failed to load.");
          return;
        }

        const blossom = new CherryBlossom({
          number: 55,
          wind: {
            speed: 1.5,
            gust: 1.8,
            enableMouseBreeze: true,
            mouseRadius: 150,
            mouseForce: 2.2
          }
        });

        const toggleBtn = document.getElementById("toggleBtn");
        let isRunning = true;
        toggleBtn.addEventListener("click", () => {
          if (isRunning) {
            blossom.stop();
            toggleBtn.textContent = "Resume";
          } else {
            blossom.start();
            toggleBtn.textContent = "Pause";
          }
          isRunning = !isRunning;
        });

        document.getElementById("moreBtn").addEventListener("click", () => {
          blossom.number += 20;
        });

        document.getElementById("fewerBtn").addEventListener("click", () => {
          blossom.number = Math.max(10, blossom.number - 20);
        });
      }

      var script = document.createElement("script");
      script.src = "./dist/cherryblossom.global.global.js";
      script.onload = initBlossom;
      script.onerror = function() {
        // Fallback to unpkg CDN if dist is unavailable
        var fallbackScript = document.createElement("script");
        fallbackScript.src = "https://unpkg.com/let-it-blossom@latest/dist/cherryblossom.global.global.js";
        fallbackScript.onload = initBlossom;
        document.head.appendChild(fallbackScript);
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
